<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Interview Schedule Manager</title>
<link rel="icon" type="image/png" href="https://cloud.codifixsolutions.com/logo.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif;}
body{background:linear-gradient(160deg,#0f172a,#1e293b,#334155);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden;perspective:600px;}
.stars-wrapper{position:fixed;inset:-40%;transform-style:preserve-3d;animation:starsDrift 10s ease-in-out infinite;z-index:0;}
@keyframes starsDrift{0%{transform:rotateX(0deg) rotateY(0deg) scale(1);}25%{transform:rotateX(4deg) rotateY(-6deg) scale(1.05);}50%{transform:rotateX(-3deg) rotateY(5deg) scale(1.02);}75%{transform:rotateX(5deg) rotateY(-3deg) scale(1.06);}100%{transform:rotateX(0deg) rotateY(0deg) scale(1);}}
.stars{width:100%;height:100%;transform-style:preserve-3d;}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle var(--d) ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:0.2;}50%{opacity:1;}}
@keyframes cardFloat{0%,100%{transform:perspective(800px) rotateX(1deg) rotateY(-1deg) translateY(0);}50%{transform:perspective(800px) rotateX(-2deg) rotateY(2deg) translateY(-12px);}}
.signup-card{position:relative;z-index:10;background:linear-gradient(145deg,rgba(30,41,59,0.9),rgba(15,23,42,0.95));border-radius:24px;border:1px solid rgba(99,102,241,0.3);padding:44px 40px;width:440px;max-width:90vw;box-shadow:0 30px 60px rgba(0,0,0,0.4),0 0 40px rgba(99,102,241,0.1);animation:cardFloat 20s ease-in-out infinite;margin:40px 0;}
.logo-img{display:block;margin:0 auto 16px;width:80px;height:80px;border-radius:50%;border:3px solid rgba(0,207,255,0.4);box-shadow:0 0 20px rgba(0,207,255,0.2);}
.logo{font-size:28px;font-weight:900;color:#00cfff;text-align:center;margin-bottom:6px;text-shadow:0 0 6px rgba(0,207,255,0.4),0 0 15px rgba(0,127,255,0.2);}
.tagline{text-align:center;color:#64748b;font-size:13px;font-weight:600;margin-bottom:28px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;color:#94a3b8;font-size:12px;font-weight:700;margin-bottom:5px;letter-spacing:0.5px;text-transform:uppercase;}
.form-group input{width:100%;padding:12px 16px;background:rgba(30,41,59,0.6);border:1.5px solid rgba(99,102,241,0.2);border-radius:12px;font-size:14px;font-weight:600;color:#e2e8f0;outline:none;transition:all 0.3s;}
.form-group input::placeholder{color:#475569;}
.form-group input:focus{border-color:#6366f1;box-shadow:0 0 20px rgba(99,102,241,0.15);}
.form-group .field-error{color:#fca5a5;font-size:11px;font-weight:600;margin-top:4px;display:none;}
.signup-btn{width:100%;padding:14px;background:linear-gradient(135deg,#4f46e5,#6366f1);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;letter-spacing:0.5px;transition:all 0.3s;margin-top:8px;}
.signup-btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(99,102,241,0.35);}
.signup-btn:active{transform:translateY(0);}
.login-link{text-align:center;margin-top:20px;color:#94a3b8;font-size:13px;font-weight:600;}
.login-link a{color:#6366f1;text-decoration:none;font-weight:700;transition:color 0.3s;}
.login-link a:hover{color:#00cfff;}
.footer-text{text-align:center;margin-top:20px;color:#475569;font-size:11px;font-weight:600;}
.toast{position:fixed;top:30px;right:30px;z-index:9999;background:linear-gradient(135deg,#059669,#10b981);color:#fff;padding:16px 28px;border-radius:14px;font-size:14px;font-weight:700;box-shadow:0 10px 30px rgba(16,185,129,0.3);transform:translateX(120%);transition:transform 0.4s ease;}
.toast.show{transform:translateX(0);}
@media(max-width:768px){
  .signup-card{padding:32px 20px;margin:20px 0;}
  .logo{font-size:24px;}
  .logo-img{width:64px;height:64px;}
}
</style>
</head>
<body>
<div class="stars-wrapper"><div class="stars" id="starsContainer"></div></div>
<div class="signup-card">
  <img class="logo-img" src="https://cloud.codifixsolutions.com/logo.png" alt="Codifix">
  <div class="logo">Create Account</div>
  <div class="tagline">Join Interview Schedule Manager</div>
  <div class="form-group">
    <label>Full Name</label>
    <input type="text" id="fullName" placeholder="Enter your full name" autocomplete="off">
    <div class="field-error" id="nameErr">Full name is required</div>
  </div>
  <div class="form-group">
    <label>Email</label>
    <input type="email" id="email" placeholder="Enter your email" autocomplete="off">
    <div class="field-error" id="emailErr">Please enter a valid email</div>
  </div>
  <div class="form-group">
    <label>Username</label>
    <input type="text" id="username" placeholder="Choose a username" autocomplete="off">
    <div class="field-error" id="userErr">Username is required</div>
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Create a password">
    <div class="field-error" id="passErr">Password must be at least 6 characters</div>
  </div>
  <div class="form-group">
    <label>Confirm Password</label>
    <input type="password" id="confirmPassword" placeholder="Confirm your password">
    <div class="field-error" id="confirmErr">Passwords do not match</div>
  </div>
  <button class="signup-btn" onclick="doSignup()">Sign Up</button>
  <div class="login-link">Already have an account? <a href="login.html">Login</a></div>
  <div class="footer-text">&copy; 2026 Codifix Solutions</div>
</div>
<div class="toast" id="toast">Account created successfully! Redirecting...</div>
<script>
(function(){
  var container = document.getElementById('starsContainer');
  for(var i = 0; i < 200; i++){
    var s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.setProperty('--d', (2 + Math.random()*4).toFixed(1) + 's');
    s.style.width = (1 + Math.random()*2) + 'px';
    s.style.height = s.style.width;
    container.appendChild(s);
  }
})();

function hideAllErrors(){
  var errs = document.querySelectorAll('.field-error');
  for(var i = 0; i < errs.length; i++){
    errs[i].style.display = 'none';
  }
}

function showError(id, msg){
  var el = document.getElementById(id);
  if(msg) el.textContent = msg;
  el.style.display = 'block';
}

function isValidEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function escapeHtml(str){
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

function doSignup(){
  hideAllErrors();
  var name = document.getElementById('fullName').value.trim();
  var email = document.getElementById('email').value.trim();
  var user = document.getElementById('username').value.trim();
  var pass = document.getElementById('password').value;
  var confirm = document.getElementById('confirmPassword').value;
  var valid = true;

  if(!name){
    showError('nameErr');
    valid = false;
  }
  if(!email || !isValidEmail(email)){
    showError('emailErr');
    valid = false;
  }
  if(!user){
    showError('userErr');
    valid = false;
  }
  if(!pass || pass.length < 6){
    showError('passErr');
    valid = false;
  }
  if(pass !== confirm){
    showError('confirmErr');
    valid = false;
  }
  if(!valid) return;

  var toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(function(){
    window.location.href = 'login.html';
  }, 2000);
}
</script>
</body>
</html>
