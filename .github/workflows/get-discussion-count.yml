name: Get Count of Discussions
on:
  workflow_dispatch:
jobs:
  get-count:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: maven
    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v1
    - name: Build Project
      run: mvn clean compile
    - name: Run Selenium Program
      env:
        JTWINE_USERNAME_HIM: ${{ secrets.JTWINE_USERNAME_HIM }}
        JTWINE_PASSWORD_HIM: ${{ secrets.JTWINE_PASSWORD_HIM }}
        JTWINE_USERNAME_SUD: ${{ secrets.JTWINE_USERNAME_SUD }}
        JTWINE_PASSWORD_SUD: ${{ secrets.JTWINE_PASSWORD_SUD }}
      run: mvn exec:java -Dexec.mainClass="GmailProjectForGitHubActions.DiscussionCount"
    - name: Commit and Push index.html
    run: |
      git config user.name "github-actions"
      git config user.email "github-actions@github.com"

      # Pull latest changes first
      git pull origin main --rebase

      # Add file
      git add deploy/discussionCount/index.html
  
      # Commit only if changed
      if git diff --cached --quiet; then
        echo "No changes to commit"
      else
        git commit -m "Update discussionCount/index.html"
        git push origin main
      fi
    - name: Upload discussionCount/index.html via FTP to Hostinger
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER_FORDISCUSSIONCOUNT }}
        username: ${{ secrets.FTP_USERNAME_FORDISCUSSIONCOUNT }}
        password: ${{ secrets.FTP_PASSWORD_FORDISCUSSIONCOUNT }}
        local-dir: ./deploy/discussionCount/
        server-dir: ./
